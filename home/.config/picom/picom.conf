/* Sombra */

shadow          = true;
shadow-radius   = 10;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color    = "#181818";


/* Fading */

fading                   = true;
fade-in-step             = 0.03;
fade-out-step            = 0.03;
fade-delta               = 8;
no-fading-openclose      = false;
no-fading-destroyed-argb = true;


/* Transparência */

frame-opacity = 1.0;


/* Borda */

corner-radius = 6;


/* Blur */

blur-method           = "dual_kawase";
blur-strength         = 5;
blur-background       = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern             = "3x3box";


/* Geral */

backend                = "glx";
dithered-present       = false;
vsync                  = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
use-ewmh-active-win    = true;
detect-transient       = true;
use-damage             = true;


/* Regras */

rules = (
  /* Animação */
  {
match = "window_type != 'dock' && class_g != 'mpv' && class_g != 'spectacle' && class_g != 'betterlockscreen' && class_g != 'i3lock'";
    animations = (
      {
        triggers = ["open"];
        opacity = { curve = "linear"; duration = 0.4; start = 2; end = "window-raw-opacity"; };
        blur-opacity   = "opacity";
        shadow-opacity = "opacity";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        scale-y  = { curve = "cubic-bezier(0,1.3,1,1)"; duration = 0.2; start = 0.2; end = 1; };
        scale-x  = 1;
        shadow-scale-x  = "scale-x";
        shadow-scale-y  = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["show"];
        opacity = { curve = "linear"; duration = 0.2; start = 0; end = "window-raw-opacity"; };
      },
      {
        triggers = ["hide"];
        opacity = { curve = "linear"; duration = 0.4; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity   = "opacity";
        shadow-opacity = "opacity";
      },
      {
        triggers = ["geometry"];
        scale-x  = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.22; start = "window-width-before / window-width"; end = 1; };
        scale-y  = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.22; start = "window-height-before / window-height"; end = 1; };
        offset-x = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.22; start = "window-x-before - window-x"; end = 0; };
        offset-y = { curve = "cubic-bezier(0,0,0,1.28)"; duration = 0.22; start = "window-y-before - window-y"; end = 0; };
        shadow-scale-x  = "scale-x";
        shadow-scale-y  = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },

/* Sombra */
{ match = "class_g = 'fl64.exe'";      shadow = false; },
{ match = "class_g = 'easyeffects'";   shadow = false; },
{ match = "class_g = 'firefox'";       shadow = false; },
{ match = "class_g = 'Conky'";         shadow = false; },
{ match = "class_g = 'Cairo-clock'";   shadow = false; },
{ match = "class_g = 'dwm'";           shadow = false; },
{ match = "class_g *= 'slop'";         shadow = false; },
{ match = "_GTK_FRAME_EXTENTS@";       shadow = false; },

  /* Blur */
{ match = "class_g != 'kitty' && class_g != 'konsole' && class_g != 'Rofi' && window_type != 'dock' && window_type != 'popup_menu'"; blur-background = false; },

  /* Wintypes */
  { match = "window_type = 'tooltip'";       fade = false; shadow = false; opacity = 1.0; focus = true; },
  { match = "window_type = 'dock'";          clip-shadow-above = true; shadow = true; },
  { match = "window_type = 'dnd'";           shadow = false; },
  { match = "window_type = 'menu'";          shadow = false; },
  { match = "window_type = 'popup_menu'";    fade = false; shadow = true; opacity = 1.0; },
  { match = "window_type = 'dropdown_menu'"; fade = false; shadow = true; opacity = 1.0; },
  { match = "window_type = 'notification'";  shadow = false; },

  /* Focus */
  { match = "class_g = 'Cairo-clock'"; focus = true; }
)
