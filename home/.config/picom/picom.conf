/* Animações */

# !Essas animações NÃO funcionarão corretamente em nenhum outro gerenciador de janelas além do fork phyOS-dwm!

# fly-in: As janelas entram na tela a partir de direções aleatórias
# maximize: As janelas surgem do centro da tela para suas respectivas posições
# minimize: As janelas minimizam de suas posições para o centro da tela
# slide-in-center: As janelas movem-se do centro-superior da tela para suas respectivas posições
# slide-out-center: As janelas movem-se para o centro-superior da tela
# slide-left: As janelas são criadas a partir da posição mais à direita e deslizam para a esquerda
# slide-right: As janelas são criadas a partir da posição mais à esquerda e deslizam para a direita
# slide-down: As janelas são movidas do topo da tela e deslizam para baixo
# slide-up: As janelas são movidas de suas posições para o topo da tela
# squeeze: As janelas são fechadas ou criadas a partir de sua posição central no eixo y (a animação é semelhante a um piscar de olhos)
# squeeze-bottom: Semelhante ao "squeeze", mas a animação começa na posição mais baixa do eixo y
# zoom: As janelas são criadas ou destruídas a partir de seu centro (não o centro da tela)

# Ativar ou desativar animações
animations=false;
# alterar a velocidade da animação das janelas na tag atual
animation-stiffness-in-tag=200;
# alterar a velocidade da animação das janelas quando a tag muda
animation-stiffness-tag-change=250;

animation-window-mass=0.6;
animation-dampening=15;
animation-clamping=true;

# Abrir janelas
animation-for-open-window="zoom";

# Minimizar ou fechar janelas
animation-for-unmap-window="none";

# Janelas pop-up (opções: slide-up, slide-down, slide-left, slide-right, squeeze, zoom)
animation-for-transient-window="none";

# Definir animação para janelas sendo removidas ao mudar de tags
# animation-for-prev-tag="none";

# Habilitar desvanecimento para janelas sendo removidas ao mudar de tags
enable-fading-prev-tag=true;

# Definir animação para janelas sendo exibidas ao mudar de tags
animation-for-next-tag="none";

# Habilitar desvanecimento para janelas sendo exibidas ao mudar de tags
enable-fading-next-tag=true;

/* Sombras */

# Sombras habilitadas no lado do cliente nas janelas.
shadow=true;

# O raio de desfoque das sombras, em pixels. (padrão é 12)
shadow-radius=10;

# O deslocamento esquerdo e superior das sombras, em pixels.
shadow-offset-x=-6;
shadow-offset-y=-6;

# Valor hexadecimal da cor da sombra. Esta opção sobrescreve shadow-(red/green/blue)
shadow-color="#444444"

# Lista de condições para janelas que não devem ter sombra.
shadow-exclude=[
  "class_g = 'fl64.exe'",
  "class_g = 'easyeffects'",
  "class_g = 'helvum'",
  "class_g = 'firefox'",
  "class_g = 'Conky'",
  "class_g = 'Cairo-clock'",
  "class_g = 'dwm'",
  "class_g *?= 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

/* Fading (Esmaecimento) */

# Esmaecer janelas ao abrir/fechar e quando houver mudanças de opacidade.
fading=true;

# Mudança de opacidade entre etapas ao esmaecer e desaparecer.
fade-in-step=0.012;
fade-out-step=0.014;

# O tempo entre etapas do efeito de esmaecimento, em milissegundos.
fade-delta=5

# Lista de condições para janelas que não devem esmaecer.
fade-exclude=[
  "class_g = 'mpv'",
  "class_g = 'spectacle'",
  "class_g = 'xfce4-panel'",
  "window_type = 'dock'"
]

# Não esmaecer janelas ARGB destruídas com moldura WM. Solução para bugs no Openbox.
no-fading-destroyed-argb=true

/* Transparência / Opacidade */

# Opacidade de janelas inativas e ativas.
inactive-opacity=1.0
active-opacity=1.0

# Opacidade das barras de título e bordas das janelas.
frame-opacity=1.0

# Permitir que a opacidade inativa definida por -i sobreponha os valores das janelas.
inactive-opacity-override=true;

# Janelas que nunca devem ser consideradas focadas.
focus-exclude=[
  "class_g = 'Cairo-clock'",
];

/* Bordas */

# Define o raio dos cantos arredondados das janelas.
corner-radius=6;

# Condições de exclusão para cantos arredondados.
rounded-corners-exclude=[
# "window_type = 'dock'",
];

/* Blur (Desfoque) */

blur:{
  method="dual_kawase";
  strength=5;
  background=true;
  background-frame=false;
  background-fixed=false;
}

# Condições de exclusão para desfoque de fundo.
blur-background-exclude=[
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'popup_menu'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Google-chrome'",
  "class_g = 'Discord'",
  "class_g = 'Peek'",
  "class_g *?= 'slop'",
  "class_g = 'firefox'",
  "class_g = 'spectacle'",
  "class_g = 'Conky'",
];

/* Configurações Gerais */

# Especificar o backend a ser usado: `xrender`, `glx`, `egl` ou `xr_glx_hybrid`.
backend="glx"

# Habilitar dither e VSync para reduzir banding e tearing.
dithered-present=true;
vsync=true

# Detecção de janelas focadas e redirecionamento.
mark-wmwin-focused=true;
mark-ovredir-focused=true;
detect-rounded-corners=true;
detect-client-opacity=true;

# Usar 'WM_TRANSIENT_FOR' para agrupar janelas focadas.
detect-transient=true;
detect-client-leader=false;

# Desativar o uso de informações de danos para redesenhar a tela inteira se necessário.
use-damage=true;

# Shader de fragmento GLSL para renderização.
window-shader-fg="default";

# Nível de log (trace, debug, info, warn, error).
log-level="warn";

/* Configurações por Tipo de Janela (Wintypes) */

wintypes:
{
  tooltip={fade=true;shadow=false;opacity=1.0;focus=true;}
  dock={clip-shadow-above=true;shadow=true;}
  dnd={shadow=false;}
  menu={shadow=true;}
  popup_menu={fade=true;shadow=true;opacity=1.0;}
  dropdown_menu={fade=false;shadow=true;opacity=1.0;}
  notification={shadow=true;}
};
