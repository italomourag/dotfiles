/* Sombras */

shadow          = true;
shadow-radius   = 10;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color    = "#444444";


/* Fading */

fading                   = true;
fade-in-step             = 0.03;
fade-out-step            = 0.03;
fade-delta               = 5;
no-fading-openclose      = false;
no-fading-destroyed-argb = true;


/* Transparência */

frame-opacity = 1.0;


/* Bordas */

corner-radius = 6;


/* Blur */

blur-method           = "dual_kawase";
blur-strength         = 5;
blur-background       = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern             = "3x3box";


/* Geral */

backend                = "glx";
dithered-present       = true;
vsync                  = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
use-ewmh-active-win    = true;
detect-transient       = true;
use-damage             = true;


/* Regras */

rules = (
  {
    match  = "class_g = 'Rofi' || class_g = 'konsole' || class_g = 'kitty'";
    shadow = true;
    animations = (
      {
        triggers       = ["open", "show"];
        opacity        = { curve = "linear"; duration = 0.15; start = 0; end = "window-raw-opacity"; };
        blur-opacity   = "opacity";
        shadow-opacity = "opacity";
        offset-x       = "(1 - scale-x) / 2 * window-width";
        offset-y       = "(1 - scale-y) / 2 * window-height";
        scale-y        = { curve = "cubic-bezier(0, 1.3, 1, 1)"; duration = 0.2; start = 0.6; end = 1; };
        scale-x        = "scale-y";
        shadow-scale-x  = "scale-x";
        shadow-scale-y  = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers       = ["close", "hide"];
        opacity        = { curve = "linear"; duration = 0.15; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity   = "opacity";
        shadow-opacity = "opacity";
        offset-x       = "(1 - scale-x) / 2 * window-width";
        offset-y       = "(1 - scale-y) / 2 * window-height";
        scale-y        = { curve = "linear"; duration = 0.15; start = 1; end = 0.6; };
        scale-x        = "scale-y";
        shadow-scale-x  = "scale-x";
        shadow-scale-y  = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },

  /* Sombra */
  { match = "class_g = 'fl64.exe'";    shadow = false; },
  { match = "class_g = 'easyeffects'"; shadow = false; },
  { match = "class_g = 'helvum'";      shadow = false; },
  { match = "class_g = 'firefox'";     shadow = false; },
  { match = "class_g = 'Conky'";       shadow = false; },
  { match = "class_g = 'Cairo-clock'"; shadow = false; },
  { match = "class_g = 'dwm'";         shadow = false; },
  { match = "class_g *= 'slop'";       shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@";     shadow = false; },

  /* Fade */
  { match = "class_g = 'mpv'";         fade = false; },
  { match = "class_g = 'spectacle'";   fade = false; },
  { match = "class_g = 'xfce4-panel'"; fade = false; },
  { match = "window_type = 'dock'";    fade = false; },

  /* Blur */
  { match = "window_type = 'desktop'";    blur-background = false; },
  { match = "window_type = 'menu'";       blur-background = false; },
  { match = "window_type = 'popup_menu'"; blur-background = false; },
  { match = "class_g = 'Google-chrome'";  blur-background = false; },
  { match = "class_g = 'discord'";        blur-background = false; },
  { match = "class_g = 'firefox'";        blur-background = false; },
  { match = "class_g = 'spectacle'";      blur-background = false; },
  { match = "class_g = 'Conky'";          blur-background = false; },
  { match = "class_g = 'dolphin'";        blur-background = false; },
  { match = "class_g = 'kate'";           blur-background = false; },
  { match = "class_g = 'okular'";         blur-background = false; },
  { match = "class_g = 'kdenlive'";       blur-background = false; },

  /* Wintypes */
  { match = "window_type = 'tooltip'";       fade = true; shadow = false; opacity = 1.0; focus = true; },
  { match = "window_type = 'dock'";          clip-shadow-above = true; shadow = true; },
  { match = "window_type = 'dnd'";           shadow = false; },
  { match = "window_type = 'menu'";          shadow = false; },
  { match = "window_type = 'popup_menu'";    fade = true; shadow = true; opacity = 1.0; },
  { match = "window_type = 'dropdown_menu'"; fade = false; shadow = true; opacity = 1.0; },
  { match = "window_type = 'notification'";  shadow = true; },

  /* Focus */
  { match = "class_g = 'Cairo-clock'"; focus = true; }
)
