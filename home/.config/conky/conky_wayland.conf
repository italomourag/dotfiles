conky.config = {
    xinerama_head = 0,
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 40,
    out_to_x = true,
    out_to_wayland = false,

    background = false,
    double_buffer = true,

    font = 'Roboto:style=Bold:size=9',
    use_xft = true,

    minimum_width = 290,
    minimum_height = 300,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',

    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_colour = '#000000',

    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',

    default_color = '#444444',
    color1 = '#e8e8e8',

    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    draw_graph_borders = false,

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    update_interval = 1.0,

    uppercase = false,
    use_spacer = 'none',
}

conky.text = [[

${color1}${font ConkySymbols:size=11}${goto 7}t${font} ${voffset -4}$hr${color}
${color1}${goto 30}Kernel ${color}$kernel ${alignr}${uptime_short}

${color1}${font MaterialIcons:size=12}${font} ${voffset -4}$hr${color}
${color1}${goto 30}Core 1 ${color}${freq_g 1}GHz ${alignr}${cpu cpu0}% ${cpubar cpu0 4,50}
${color1}${goto 30}Core 2 ${color}${freq_g 2}GHz ${alignr}${cpu cpu1}% ${cpubar cpu1 4,50}
${color1}${goto 30}Core 3 ${color}${freq_g 3}GHz ${alignr}${cpu cpu2}% ${cpubar cpu2 4,50}
${color1}${goto 30}Core 4 ${color}${freq_g 4}GHz ${alignr}${cpu cpu3}% ${cpubar cpu3 4,50}
${color1}${goto 30}${cpugraph 45,240 #444444 #444444}

${color1}${font MaterialIcons:size=12}${font} ${voffset -5}$hr${color}
${color1}${goto 30}CPU ${color}${exec sensors | grep 'CPU' | awk 'NR==1{print $2}'} ${alignr}${color1}PCH ${color}${exec sensors | grep 'temp1' | awk 'NR==1{print $2}'}

${color1}${font MaterialIcons:size=12}${font} ${voffset -5}$hr${color}
${color1}${goto 30}RAM ${color}$mem / $memmax ${alignr}$memperc% ${membar 4,50}
${color1}${goto 30}SWAP ${color}$swap / $swapmax ${alignr}$swapperc% ${swapbar 4,50}

${color1}${font MaterialIcons:size=12}${font} ${voffset -5}$hr${color}
${color1}${goto 30}SSD ${color}${fs_used /} / ${fs_size /} ${alignr}${fs_used_perc /}% ${fs_bar 4,50 /}

${color1}${font MaterialIcons:size=12}${font} ${voffset -5}$hr${color}
${color1}${goto 30}Sinal ${color}${wireless_link_qual_perc wlp3s0}% ${alignr}${wireless_link_bar 4,50 wlp3s0}
${color1}${goto 30}Velocidade ${color}${alignr}${wireless_bitrate wlp3s0}
${color1}${goto 30}${font MaterialIcons:size=10}${font} ${color}${downspeed wlp3s0} ${alignr}${totaldown wlp3s0}
${color1}${goto 30}${font MaterialIcons:size=10}${font} ${color}${upspeed wlp3s0} ${alignr}${totalup wlp3s0}

$alignc

]]
