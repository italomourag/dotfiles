# Configuração do Hyprland
# Documentação: https://wiki.hyprland.org/

### MONITORES ###
# Formato: nome, resolução@taxa_atualização, posição, escala
monitor = eDP-1, 1366x768@60.00500, 0x0, 1

### PROGRAMAS ###
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

### AUTOSTART ###
# Inicialização de agentes e daemons do sistema
exec-once = /usr/lib64/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = blueman-applet &
exec-once = nm-applet &
exec-once = xfce4-power-manager &
exec-once = xfce4-pulseaudio-plugin &
exec-once = waybar &
exec-once = ~/.config/dunst/musicnotify.sh

### VARIÁVEIS DE AMBIENTE ###
env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_SIZE, 18
env = HYPRCURSOR_SIZE, 18
env = QT_QPA_PLATFORM, wayland
env = XDG_MENU_PREFIX, arch-

### APARÊNCIA (GENERAL) ###
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 0

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Permite redimensionar arrastando as bordas
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

### DECORAÇÃO ###
decoration {
    rounding = 7
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = yes
        range = 12
        render_power = 5
        color = rgba(68, 68, 68, 1)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
        xray = 1
    }
}

### ANIMAÇÕES ###
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

### LAYOUTS ###
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

### MISC (DIVERSOS) ###
misc {
    background_color = 0x269cb6
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

debug {
    disable_logs = false
}

### ENTRADA (INPUT) ###
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = thinkpad
    follow_mouse = 1
    sensitivity = -0.2

    touchpad {
        natural_scroll = false
    }
}

gestures {
    gesture = 3, horizontal, workspace
}

device {
    name = epic-mouse-v1
    sensitivity = -0.2
}

### ATALHOS (BINDS) ###
$mainMod = SUPER

# Atalhos de Aplicativos e Sistema
bind = $mainMod, SPACE, exec, ~/.config/rofi/drun/drun.sh
bind = $mainMod, F9, exec, ~/.config/rofi/powermenu/powermenu.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, print, exec, gradia --screenshot=FULL
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Navegação de Foco
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Gestão de Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover Janela para Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Especial (Scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Navegação com Mouse e Teclas Modificadoras
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:273, movewindow
bindm = $mainMod, mouse:272, resizewindow
bindm = $mainMod, Control_L, movewindow
bindm = $mainMod, ALT_L, resizewindow
bindm = ALT_R, mouse:272, movewindow

# Teclas Multimídia (Scripts Dunst/Mako)
bind = $mainMod, F3, exec, ~/.config/mako/makovolume.sh -i
bind = $mainMod, F2, exec, ~/.config/mako/makovolume.sh -d
bind = $mainMod, F1, exec, ~/.config/mako/makovolume.sh -m
bind = $mainMod, F4, exec, ~/.config/mako/makovolume.sh -mm
bind = $mainMod, F6, exec, ~/.config/mako/makobright.sh -i
bind = $mainMod, F5, exec, ~/.config/mako/makobright.sh -d
